# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    # Run inside the official python:3.8 image instead of using setup-python,
    # since GitHub-hosted runners keep moving to newer Ubuntu releases that
    # no longer have a compatible prebuilt Python 3.8 available.
    container: python:3.8-slim

    steps:
    - name: Install git (not present in the python:3.8-slim image)
      run: apt-get update && apt-get install -y --no-install-recommends git
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -e .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run unit tests
      # Allow tests to fail so we don't block merging PRs
      continue-on-error: true
      run: |
        pytest -v
